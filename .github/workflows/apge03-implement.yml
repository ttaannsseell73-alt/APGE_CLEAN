name: APGE-03 One-shot Implementation

on:
  push:
    branches:
      - apge-03-controlled-grid-validation

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[apge03-runner]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply APGE-03 hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # RiskEngine: immutable side tracking + signed accounting.
          # ------------------------------------------------------------
          p = Path('src/apge/simulator.py')
          s = p.read_text()

          s = replace_once(
              s,
              "    def __init__(self, order_id: str, amount: Decimal):\n        self.order_id = order_id\n        self.initial_amount = amount\n",
              "    def __init__(self, order_id: str, amount: Decimal, *, symbol: str = \"\", side: str = \"\"):\n        self.order_id = order_id\n        self.initial_amount = amount\n        self.symbol = symbol\n        self.side = str(side).upper()\n",
              'Order metadata')

          s = replace_once(
              s,
              "    def __init__(self, position_limit: Decimal):\n        self._lock = threading.RLock()\n\n        self.position_limit = position_limit\n",
              "    def __init__(self, position_limit: Decimal, *, require_explicit_side: bool = False):\n        self._lock = threading.RLock()\n\n        self.position_limit = position_limit\n        self.require_explicit_side = require_explicit_side\n",
              'RiskEngine strict-side flag')

          marker = "    # -- Approval lifecycle --------------------------------------------------\n"
          helper = '''    @staticmethod\n    def _normalize_side(side: str) -> str:\n        return str(side or \"\").upper()\n\n    def _position_delta(self, order: Order, amount: Decimal) -> Decimal:\n        \"\"\"Translate an absolute fill delta into signed inventory movement.\n\n        Production runtimes require explicit BUY/SELL side. Legacy simulator\n        tests may omit side; in that compatibility mode only, the historical\n        positive-position behavior is retained. Explicit invalid sides are\n        rejected before an Order can be created.\n        \"\"\"\n        if order.side == \"BUY\":\n            return amount\n        if order.side == \"SELL\":\n            return -amount\n        if self.require_explicit_side:\n            self.unresolved_conflicts.add(order.order_id)\n            self._enter_reconciling()\n            return Decimal('0')\n        return amount\n\n'''
          if helper not in s:
              s = replace_once(s, marker, helper + marker, 'position delta helper')

          old = """        with self._lock:\n            if self.system_state != SystemState.OPERATIONAL:\n                return None\n\n            if self._has_unknown_orders():\n"""
          new = """        with self._lock:\n            normalized_side = self._normalize_side(side)\n            if normalized_side and normalized_side not in (\"BUY\", \"SELL\"):\n                return None\n            if self.require_explicit_side and normalized_side not in (\"BUY\", \"SELL\"):\n                return None\n            side = normalized_side\n\n            if self.system_state != SystemState.OPERATIONAL:\n                return None\n\n            if self._has_unknown_orders():\n"""
          s = replace_once(s, old, new, 'approval side validation')

          old = """            if approval.status != ApprovalStatus.VALID:\n                return False\n\n            # --- TTL check (from record, not the mutable object) ---\n"""
          new = """            if approval.status != ApprovalStatus.VALID:\n                return False\n\n            if record.side and record.side not in (\"BUY\", \"SELL\"):\n                return self._reject_approval(\n                    approval, record, ApprovalStatus.REJECTED)\n            if self.require_explicit_side and record.side not in (\"BUY\", \"SELL\"):\n                return self._reject_approval(\n                    approval, record, ApprovalStatus.REJECTED)\n\n            # --- TTL check (from record, not the mutable object) ---\n"""
          s = replace_once(s, old, new, 'consume side validation')

          s = replace_once(
              s,
              "            self.orders[order_id] = Order(order_id, record.amount)\n",
              "            self.orders[order_id] = Order(\n                order_id, record.amount, symbol=record.symbol, side=record.side)\n",
              'order side persistence')

          # Signed position movements. The exact occurrences are intentionally
          # constrained so any future drift fails this one-shot runner.
          if s.count("self.current_position += amount") != 1:
              raise SystemExit('expected one direct amount position increment')
          s = s.replace("self.current_position += amount", "self.current_position += self._position_delta(order, amount)")

          if s.count("self.current_position += diff") != 4:
              raise SystemExit(f"expected four diff position increments, found {s.count('self.current_position += diff')}")
          s = s.replace("self.current_position += diff", "self.current_position += self._position_delta(order, diff)")

          p.write_text(s)

          # ------------------------------------------------------------
          # ExecutionEngine: authoritative cancel lifecycle.
          # ------------------------------------------------------------
          p = Path('src/apge/execution_engine.py')
          s = p.read_text()

          old = """    def __init__(self, persistence: Persistence, adapter: BinanceAdapter, risk_engine: RiskEngine):\n        self.persistence = persistence\n        self.adapter = adapter\n        self.risk_engine = risk_engine\n\n"""
          new = """    def __init__(self, persistence: Persistence, adapter: BinanceAdapter, risk_engine: RiskEngine):\n        self.persistence = persistence\n        self.adapter = adapter\n        self.risk_engine = risk_engine\n\n    @staticmethod\n    def _authoritative_filled_qty(value: Any) -> Optional[Decimal]:\n        if value is None:\n            return None\n        try:\n            qty = Decimal(str(value))\n        except Exception:\n            return None\n        if qty.is_nan() or qty.is_infinite() or qty < Decimal(\"0\"):\n            return None\n        return qty\n\n"""
          s = replace_once(s, old, new, 'cancel qty parser')

          start = s.index("    def cancel_order(self, symbol: str, client_order_id: str) -> bool:\n")
          end = s.index("    def handle_order_update(self, update: Dict[str, Any]):\n", start)
          cancel_impl = '''    def cancel_order(self, symbol: str, client_order_id: str) -> bool:\n        \"\"\"Request cancel without releasing risk until fill total is authoritative.\"\"\"\n        intent = self.persistence.get_intent(client_order_id)\n        if not intent:\n            return False\n\n        if intent[\"status\"] in (\"FILLED\", \"CANCELED\", \"REJECTED\"):\n            return False\n\n        # A cancel request never releases risk by itself.\n        self.risk_engine.request_cancel(client_order_id)\n\n        try:\n            response = self.adapter.cancel_order(symbol, client_order_id)\n        except Exception:\n            # Network/error ambiguity is a reconciliation event.\n            self.risk_engine.restore_connection()\n            raise\n\n        raw_status = response.get(\"status\", \"UNKNOWN\")\n\n        if \"orderId\" not in response:\n            self.risk_engine.restore_connection()\n            return False\n\n        mapped_state = self.adapter._map_order_state(raw_status)\n        self.persistence.update_intent_status(\n            client_order_id, mapped_state, str(response[\"orderId\"]), raw_status=raw_status)\n\n        if mapped_state == OrderState.CANCELED:\n            final_filled = self._authoritative_filled_qty(response.get(\"executedQty\"))\n            if final_filled is None:\n                # Never guess zero. Keep reservation and reconcile.\n                self.risk_engine.restore_connection()\n            else:\n                self.risk_engine.on_cancel_confirmed(client_order_id, final_filled)\n            return True\n\n        # Any non-CANCELED cancel acknowledgement is uncertain.\n        self.risk_engine.restore_connection()\n        return False\n\n'''
          s = s[:start] + cancel_impl + s[end:]

          marker = """        # Regardless of fill, update the final order state\n"""
          insert = '''        # A CANCELED websocket update is authoritative only when its\n        # cumulative filled quantity is present and valid.\n        if mapped_state == OrderState.CANCELED:\n            final_filled = self._authoritative_filled_qty(\n                update.get(\"accumulated_filled_qty\"))\n            if final_filled is None:\n                self.risk_engine.restore_connection()\n            else:\n                self.risk_engine.on_cancel_confirmed(cid, final_filled)\n\n'''
          s = replace_once(s, marker, insert + marker, 'websocket cancel lifecycle')
          p.write_text(s)

          # ------------------------------------------------------------
          # Runtime: deterministic diff order + stop creation if cancel
          # uncertainty moved risk state away from OPERATIONAL.
          # ------------------------------------------------------------
          p = Path('src/apge/testnet_runtime.py')
          s = p.read_text()
          old = """        # 4. Execute Cancellations\n        for key in to_cancel_keys:\n            cids = order_map[key]\n            for cid in cids:\n                execution_engine.cancel_order(self.symbol, cid)\n\n        # 5. Execute Creations\n        for side, price, qty in to_create:\n            proposal = next((p for p in proposals if p.side == side and p.price == price and p.quantity == qty), None)\n            if proposal:\n                execution_engine.execute_proposal(self.symbol, proposal)\n"""
          new = """        # 4. Execute Cancellations deterministically.\n        for key in sorted(to_cancel_keys, key=lambda x: (x[0], x[1], x[2])):\n            cids = sorted(order_map[key])\n            for cid in cids:\n                execution_engine.cancel_order(self.symbol, cid)\n\n        # If any cancel outcome was uncertain, fail closed before creating\n        # replacement exposure in the same cycle.\n        if execution_engine.risk_engine.system_state != SystemState.OPERATIONAL:\n            logger.warning(\"Grid cycle stopped after cancellation uncertainty; reconciliation required.\")\n            return\n\n        # 5. Execute Creations deterministically.\n        for side, price, qty in sorted(to_create, key=lambda x: (x[0], x[1], x[2])):\n            proposal = next((p for p in proposals if p.side == side and p.price == price and p.quantity == qty), None)\n            if proposal:\n                execution_engine.execute_proposal(self.symbol, proposal)\n"""
          s = replace_once(s, old, new, 'grid diff lifecycle')
          p.write_text(s)

          # ------------------------------------------------------------
          # Production runner requires explicit side; dry-run cancel response
          # mirrors Binance's authoritative executedQty field.
          # ------------------------------------------------------------
          p = Path('src/apge/bot_runner.py')
          s = p.read_text()
          s = replace_once(
              s,
              'risk_engine = RiskEngine(position_limit=Decimal("5.0"))',
              'risk_engine = RiskEngine(position_limit=Decimal("5.0"), require_explicit_side=True)',
              'production strict side')
          s = replace_once(
              s,
              'return {"status": "CANCELED", "orderId": f"mock_{cid}"}',
              'return {"status": "CANCELED", "orderId": f"mock_{cid}", "executedQty": "0"}',
              'dry-run authoritative cancel')
          p.write_text(s)

          # Existing offline grid mock represents a definite zero-fill cancel.
          p = Path('tests/test_offline_e2e_grid.py')
          s = p.read_text()
          s = replace_once(
              s,
              'return {"status": "CANCELED", "orderId": "ext_cancel", "clientOrderId": cid}',
              'return {"status": "CANCELED", "orderId": "ext_cancel", "clientOrderId": cid, "executedQty": "0"}',
              'offline mock authoritative cancel')
          p.write_text(s)

          # ------------------------------------------------------------
          # New APGE-03 regression suite.
          # ------------------------------------------------------------
          Path('tests/test_apge03_hardening.py').write_text(r'''from decimal import Decimal\n\nfrom apge.execution_engine import ExecutionEngine\nfrom apge.grid_strategy import MarketRegime, OrderProposal\nfrom apge.persistence import Persistence\nfrom apge.simulator import OrderState, RiskEngine, SystemState\nfrom apge.testnet_runtime import TestnetRuntime\n\n\ndef _tracked_order(engine: RiskEngine, order_id: str, side: str, amount: str = \"2\"):\n    qty = Decimal(amount)\n    approval = engine.request_approval(qty, symbol=\"BTCUSDT\", side=side)\n    assert approval is not None\n    assert engine.consume_approval_and_submit(\n        approval, order_id, symbol=\"BTCUSDT\", side=side)\n    engine.resolve_order(order_id, OrderState.OPEN, Decimal(\"0\"))\n    return engine.orders[order_id]\n\n\ndef test_signed_buy_and_sell_full_fills():\n    buy = RiskEngine(Decimal(\"10\"), require_explicit_side=True)\n    _tracked_order(buy, \"buy-1\", \"BUY\")\n    buy.on_fill(\"buy-1\", \"b1\", Decimal(\"2\"))\n    assert buy.current_position == Decimal(\"2\")\n    assert buy.reservations == Decimal(\"0\")\n\n    sell = RiskEngine(Decimal(\"10\"), require_explicit_side=True)\n    _tracked_order(sell, \"sell-1\", \"SELL\")\n    sell.on_fill(\"sell-1\", \"s1\", Decimal(\"2\"))\n    assert sell.current_position == Decimal(\"-2\")\n    assert sell.reservations == Decimal(\"0\")\n\n\ndef test_signed_partial_fill_and_duplicate_idempotency():\n    engine = RiskEngine(Decimal(\"10\"), require_explicit_side=True)\n    _tracked_order(engine, \"sell-1\", \"SELL\", \"4\")\n    engine.on_fill(\"sell-1\", \"s1\", Decimal(\"1.5\"))\n    engine.on_fill(\"sell-1\", \"s1\", Decimal(\"1.5\"))\n    assert engine.current_position == Decimal(\"-1.5\")\n    assert engine.reservations == Decimal(\"2.5\")\n\n\ndef test_strict_side_rejects_missing_or_invalid_side():\n    engine = RiskEngine(Decimal(\"10\"), require_explicit_side=True)\n    assert engine.request_approval(Decimal(\"1\"), symbol=\"BTCUSDT\") is None\n    assert engine.request_approval(Decimal(\"1\"), symbol=\"BTCUSDT\", side=\"HOLD\") is None\n    assert engine.reservations == Decimal(\"0\")\n\n\ndef test_overfill_keeps_worst_case_risk_and_reconciles():\n    engine = RiskEngine(Decimal(\"10\"), require_explicit_side=True)\n    _tracked_order(engine, \"buy-1\", \"BUY\", \"2\")\n    engine.on_fill(\"buy-1\", \"too-much\", Decimal(\"3\"))\n    assert engine.system_state == SystemState.RECONCILING\n    assert engine.current_position == Decimal(\"0\")\n    assert engine.reservations == Decimal(\"2\")\n\n\nclass CancelAdapter:\n    def __init__(self, cancel_response):\n        self.cancel_response = dict(cancel_response)\n\n    def submit_limit_order(self, **kwargs):\n        return {\"status\": \"NEW\", \"orderId\": \"ext-new\", \"clientOrderId\": kwargs[\"client_order_id\"]}\n\n    def cancel_order(self, symbol, cid):\n        response = dict(self.cancel_response)\n        response.setdefault(\"clientOrderId\", cid)\n        return response\n\n    def _map_order_state(self, status):\n        return {\n            \"NEW\": OrderState.OPEN,\n            \"CANCELED\": OrderState.CANCELED,\n            \"FILLED\": OrderState.FILLED,\n        }.get(status, OrderState.UNKNOWN)\n\n\ndef _engine_with_order(cancel_response, side=\"BUY\", qty=\"2\"):\n    db = Persistence()\n    risk = RiskEngine(Decimal(\"20\"), require_explicit_side=True)\n    adapter = CancelAdapter(cancel_response)\n    execution = ExecutionEngine(db, adapter, risk)\n    cid = execution.execute_proposal(\n        \"BTCUSDT\", OrderProposal(side, Decimal(\"100\"), Decimal(qty)))\n    assert cid\n    return db, risk, execution, cid\n\n\ndef test_rest_zero_fill_cancel_releases_remaining_reservation():\n    db, risk, execution, cid = _engine_with_order(\n        {\"status\": \"CANCELED\", \"orderId\": \"ext-cancel\", \"executedQty\": \"0\"})\n    try:\n        assert risk.reservations == Decimal(\"2\")\n        assert execution.cancel_order(\"BTCUSDT\", cid)\n        assert risk.orders[cid].state == OrderState.CANCELED\n        assert risk.reservations == Decimal(\"0\")\n        assert risk.system_state == SystemState.OPERATIONAL\n    finally:\n        db.close()\n\n\ndef test_partial_sell_fill_then_cancel_is_signed_and_releases_only_remainder():\n    db, risk, execution, cid = _engine_with_order(\n        {\"status\": \"CANCELED\", \"orderId\": \"ext-cancel\", \"executedQty\": \"1\"},\n        side=\"SELL\", qty=\"2\")\n    try:\n        execution.handle_order_update({\n            \"client_order_id\": cid,\n            \"execution_type\": \"TRADE\",\n            \"trade_id\": \"sell-fill\",\n            \"last_filled_qty\": Decimal(\"1\"),\n            \"last_filled_price\": Decimal(\"100\"),\n            \"accumulated_filled_qty\": Decimal(\"1\"),\n            \"mapped_state\": OrderState.PARTIALLY_FILLED,\n            \"order_status\": \"PARTIALLY_FILLED\",\n        })\n        assert risk.current_position == Decimal(\"-1\")\n        assert risk.reservations == Decimal(\"1\")\n        assert execution.cancel_order(\"BTCUSDT\", cid)\n        assert risk.current_position == Decimal(\"-1\")\n        assert risk.reservations == Decimal(\"0\")\n    finally:\n        db.close()\n\n\ndef test_missing_authoritative_cancel_total_fails_closed():\n    db, risk, execution, cid = _engine_with_order(\n        {\"status\": \"CANCELED\", \"orderId\": \"ext-cancel\"})\n    try:\n        assert execution.cancel_order(\"BTCUSDT\", cid)\n        assert risk.system_state == SystemState.RECONCILING\n        assert risk.reservations == Decimal(\"2\")\n    finally:\n        db.close()\n\n\ndef test_websocket_cancel_uses_accumulated_filled_qty_and_is_idempotent():\n    db, risk, execution, cid = _engine_with_order(\n        {\"status\": \"CANCELED\", \"orderId\": \"unused\", \"executedQty\": \"0\"})\n    try:\n        update = {\n            \"client_order_id\": cid,\n            \"execution_type\": \"CANCELED\",\n            \"trade_id\": \"\",\n            \"last_filled_qty\": Decimal(\"0\"),\n            \"last_filled_price\": Decimal(\"0\"),\n            \"accumulated_filled_qty\": Decimal(\"0\"),\n            \"mapped_state\": OrderState.CANCELED,\n            \"order_status\": \"CANCELED\",\n        }\n        execution.handle_order_update(update)\n        execution.handle_order_update(update)\n        assert risk.reservations == Decimal(\"0\")\n        assert risk.orders[cid].state == OrderState.CANCELED\n    finally:\n        db.close()\n\n\nclass GridAdapter(CancelAdapter):\n    def __init__(self):\n        super().__init__({\"status\": \"CANCELED\", \"orderId\": \"cancelled\", \"executedQty\": \"0\"})\n        self.submissions = []\n\n    def submit_limit_order(self, **kwargs):\n        self.submissions.append(dict(kwargs))\n        return {\"status\": \"NEW\", \"orderId\": f\"ext-{len(self.submissions)}\", \"clientOrderId\": kwargs[\"client_order_id\"]}\n\n    def parse_book_ticker(self, payload):\n        return {\n            \"symbol\": payload[\"s\"],\n            \"bid_price\": Decimal(str(payload[\"b\"])),\n            \"ask_price\": Decimal(str(payload[\"a\"])),\n        }\n\n\ndef test_deterministic_reprice_100_cycles_has_no_reservation_or_cid_leak():\n    db = Persistence()\n    adapter = GridAdapter()\n    risk = RiskEngine(Decimal(\"1000\"), require_explicit_side=True)\n    execution = ExecutionEngine(db, adapter, risk)\n    runtime = TestnetRuntime(adapter)\n    runtime.tick_size = Decimal(\"0.1\")\n    runtime.step_size = Decimal(\"1\")\n    runtime.filters = {\n        \"minQty\": Decimal(\"1\"),\n        \"minNotional\": Decimal(\"5\"),\n        \"maxQty\": Decimal(\"100\"),\n    }\n    runtime.attach_components(execution, None, \"BTCUSDT\")\n\n    try:\n        seen_active_sets = []\n        for i in range(100):\n            bid = Decimal(\"100\") + Decimal(i)\n            ask = bid + Decimal(\"1\")\n            runtime.handle_book_ticker({\"s\": \"BTCUSDT\", \"b\": str(bid), \"a\": str(ask), \"u\": i})\n            runtime.run_grid_cycle(\n                grid_spacing=Decimal(\"1\"),\n                base_size=Decimal(\"1\"),\n                level_count=1,\n                max_inventory=Decimal(\"10\"),\n                system_state=risk.system_state,\n                market_regime=MarketRegime.NEUTRAL,\n                execution_engine=execution,\n            )\n\n            assert risk.system_state == SystemState.OPERATIONAL\n            assert risk.reservations >= Decimal(\"0\")\n            active = db.get_active_intents()\n            active_ids = {row[\"client_order_id\"] for row in active}\n            assert len(active_ids) == len(active)\n            assert risk.reservations == sum(\n                (Decimal(row[\"quantity\"]) for row in active), Decimal(\"0\"))\n\n            risk_active_ids = {\n                oid for oid, order in risk.orders.items()\n                if order.state in (OrderState.OPEN, OrderState.PARTIALLY_FILLED, OrderState.UNKNOWN)\n            }\n            assert risk_active_ids == active_ids\n            seen_active_sets.append(active_ids)\n\n        assert all(len(ids) == 2 for ids in seen_active_sets)\n    finally:\n        db.close()\n''')
          PY

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run APGE offline gate
        env:
          PYTHONPATH: src
        run: |
          python -m pytest --collect-only -q
          python -m pytest -q

      - name: Commit validated APGE-03 changes
        shell: bash
        run: |
          git config user.name "APGE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(apge): harden signed fills and cancel lifecycle"
          git push origin HEAD:apge-03-controlled-grid-validation
