name: APGE-03 Hardening V3

on:
  push:
    branches:
      - apge-03-controlled-grid-validation

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[apge03-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply V3 hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          # ----------------------------------------------------------
          # Persistence helpers for authoritative cumulative fills.
          # ----------------------------------------------------------
          p = Path('src/apge/persistence.py')
          s = p.read_text()
          marker = "    def update_runtime_state(self, key: str, value: str):\n"
          addition = '''    def sync_filled_quantity(self, client_order_id: str, cumulative_quantity: Decimal, average_price: Optional[Decimal] = None):
        """Persist an authoritative cumulative fill quantity without inventing a trade id."""
        with self.conn:
            if average_price is None:
                self.conn.execute("""
                    UPDATE intents SET filled_quantity = ?, updated_at = CURRENT_TIMESTAMP
                    WHERE client_order_id = ?
                """, (str(cumulative_quantity), client_order_id))
            else:
                self.conn.execute("""
                    UPDATE intents SET filled_quantity = ?, average_price = ?, updated_at = CURRENT_TIMESTAMP
                    WHERE client_order_id = ?
                """, (str(cumulative_quantity), str(average_price), client_order_id))

    def get_recorded_fill_total(self, client_order_id: str) -> Decimal:
        rows = self.conn.execute(
            "SELECT quantity FROM fills WHERE client_order_id = ?", (client_order_id,)
        ).fetchall()
        return sum((Decimal(row["quantity"]) for row in rows), Decimal("0"))

'''
          if 'def sync_filled_quantity' not in s:
              s = once(s, marker, addition + marker, 'persistence authoritative helpers')
          p.write_text(s)

          # ----------------------------------------------------------
          # RiskEngine: side-aware net exposure and restart rebuild.
          # ----------------------------------------------------------
          p = Path('src/apge/simulator.py')
          s = p.read_text()

          old = '''    def get_available_capacity(self) -> Decimal:
        return self.position_limit - (self.current_position + self.reservations)
'''
          new = '''    def get_available_capacity(self) -> Decimal:
        # Legacy scalar view retained for compatibility with older simulator tests.
        return self.position_limit - (self.current_position + self.reservations)

    def _pending_for_side(self, side: str) -> Decimal:
        side = self._normalize_side(side)
        total = Decimal('0')
        for record in self._approval_registry.values():
            if record.side == side:
                total += record.amount
        for order in self.orders.values():
            if order.side != side:
                continue
            if order.state in (OrderState.FILLED, OrderState.CANCELED):
                continue
            remaining = order.initial_amount - order.filled_amount
            if remaining > 0:
                total += remaining
        return total

    def get_available_capacity_for_side(self, side: str) -> Decimal:
        """Worst-case signed capacity without netting opposite pending orders."""
        side = self._normalize_side(side)
        if side == 'BUY':
            value = self.position_limit - (self.current_position + self._pending_for_side('BUY'))
        elif side == 'SELL':
            value = self.position_limit + self.current_position - self._pending_for_side('SELL')
        else:
            return Decimal('0')
        return max(Decimal('0'), value)
'''
          s = once(s, old, new, 'side-aware capacity helpers')

          old = '''            if self.get_available_capacity() >= amount:
                aid = self._next_approval_id
'''
          new = '''            if self.require_explicit_side:
                has_capacity = self.get_available_capacity_for_side(side) >= amount
            else:
                has_capacity = self.get_available_capacity() >= amount

            if has_capacity:
                aid = self._next_approval_id
'''
          s = once(s, old, new, 'side-aware approval capacity')

          start = s.index('    def on_cancel_confirmed(self, order_id: str, final_filled_amount: Decimal):\n')
          end = s.index('    # -- Connection / state transitions', start)
          replacement = '''    def on_cancel_confirmed(self, order_id: str, final_filled_amount: Decimal) -> bool:
        """Apply an authoritative cancel total. Returns True only when consistent."""
        with self._lock:
            if not self._is_valid_non_negative(final_filled_amount):
                self._enter_reconciling()
                return False

            if order_id not in self.orders:
                self._enter_reconciling()
                return False
            order = self.orders[order_id]

            if order.state == OrderState.CANCELED:
                if order.cancel_confirmed_total == final_filled_amount:
                    return True
                self.unresolved_conflicts.add(order_id)
                self._enter_reconciling()
                return False

            if order.state == OrderState.FILLED:
                # A later CANCELED report contradicts a definitive FILLED state.
                self.unresolved_conflicts.add(order_id)
                self._enter_reconciling()
                return False

            if final_filled_amount > order.initial_amount:
                self.unresolved_conflicts.add(order_id)
                self._enter_reconciling()
                self._bump_risk_version()
                return False

            if final_filled_amount < order.filled_amount:
                self.unresolved_conflicts.add(order_id)
                self._enter_reconciling()
                self._bump_risk_version()
                return False

            order.state = OrderState.CANCELED
            order.cancel_confirmed_total = final_filled_amount

            diff = final_filled_amount - order.filled_amount
            if diff > 0:
                order.filled_amount += diff
                self.current_position += self._position_delta(order, diff)
                self.reservations -= diff

            remaining = order.initial_amount - order.filled_amount
            if remaining > 0:
                self.reservations -= remaining

            if self.reservations < 0:
                self.unresolved_conflicts.add(order_id)
                self._enter_reconciling()
                return False

            self._bump_risk_version()
            return True

'''
          s = s[:start] + replacement + s[end:]

          marker = '    # -- Connection / state transitions --------------------------------------\n'
          rebuild = '''    def rebuild_from_authoritative_state(self, current_position: Decimal, intents: List[dict]) -> bool:
        """Rebuild in-memory risk state from an exchange/persistence reconciliation snapshot."""
        with self._lock:
            if not isinstance(current_position, Decimal) or current_position.is_nan() or current_position.is_infinite():
                self._enter_reconciling()
                return False

            rebuilt: Dict[str, Order] = {}
            reservations = Decimal('0')
            buy_pending = Decimal('0')
            sell_pending = Decimal('0')

            for intent in intents:
                status_name = str(intent.get('status', ''))
                if status_name == 'REJECTED':
                    continue
                try:
                    state = OrderState[status_name]
                    qty = Decimal(str(intent['quantity']))
                    filled = Decimal(str(intent.get('filled_quantity', '0')))
                    observed = Decimal(str(intent.get('observed_filled_quantity', filled)))
                except Exception:
                    self._enter_reconciling()
                    return False

                side = self._normalize_side(intent.get('side', ''))
                symbol = str(intent.get('symbol', ''))
                cid = str(intent.get('client_order_id', ''))
                if not cid or not symbol or side not in ('BUY', 'SELL'):
                    self._enter_reconciling()
                    return False
                if not self._is_valid_amount(qty):
                    self._enter_reconciling()
                    return False
                if not self._is_valid_non_negative(filled) or filled > qty:
                    self._enter_reconciling()
                    return False
                if not self._is_valid_non_negative(observed) or observed > filled:
                    self._enter_reconciling()
                    return False
                if state == OrderState.FILLED and filled != qty:
                    self._enter_reconciling()
                    return False
                if state == OrderState.OPEN and filled != 0:
                    self._enter_reconciling()
                    return False
                if state == OrderState.PARTIALLY_FILLED and not (Decimal('0') < filled < qty):
                    self._enter_reconciling()
                    return False

                order = Order(cid, qty, symbol=symbol, side=side)
                order.filled_amount = filled
                order.seen_fills_sum = observed
                order.state = state
                if state == OrderState.CANCELED:
                    order.cancel_requested = True
                    order.cancel_confirmed_total = filled

                rebuilt[cid] = order
                if state not in (OrderState.FILLED, OrderState.CANCELED):
                    remaining = qty - filled
                    reservations += remaining
                    if side == 'BUY':
                        buy_pending += remaining
                    else:
                        sell_pending += remaining

            # Never resume if the reconciled worst-case net exposure is outside limits.
            if current_position + buy_pending > self.position_limit:
                self._enter_reconciling()
                return False
            if current_position - sell_pending < -self.position_limit:
                self._enter_reconciling()
                return False

            self.current_position = current_position
            self.reservations = reservations
            self.orders = rebuilt
            self.active_approvals = []
            self._approval_registry = {}
            self.unresolved_conflicts = set()
            self.processed_fills = set()
            self._bump_risk_version()
            return True

'''
          if 'def rebuild_from_authoritative_state' not in s:
              s = once(s, marker, rebuild + marker, 'risk authoritative rebuild')
          p.write_text(s)

          # ----------------------------------------------------------
          # ExecutionEngine: persistence only goes terminal after a
          # consistent authoritative cancel total.
          # ----------------------------------------------------------
          p = Path('src/apge/execution_engine.py')
          s = p.read_text()

          marker = '    def _generate_client_order_id(self, symbol: str, side: str, quantity: Decimal, price: Decimal) -> str:\n'
          helper = '''    def _sync_authoritative_fill_total(self, client_order_id: str, final_filled: Decimal, average_price: Any = None) -> bool:
        intent = self.persistence.get_intent(client_order_id)
        if not intent:
            return False
        try:
            persisted = Decimal(str(intent.get("filled_quantity", "0")))
        except Exception:
            self.risk_engine.restore_connection()
            return False
        if final_filled < persisted:
            self.risk_engine.restore_connection()
            return False
        avg = None
        if average_price is not None:
            try:
                candidate = Decimal(str(average_price))
                if not candidate.is_nan() and not candidate.is_infinite() and candidate >= 0:
                    avg = candidate
            except Exception:
                avg = None
        self.persistence.sync_filled_quantity(client_order_id, final_filled, avg)
        return True

'''
          if 'def _sync_authoritative_fill_total' not in s:
              s = once(s, marker, helper + marker, 'execution authoritative fill helper')

          start = s.index('    def cancel_order(self, symbol: str, client_order_id: str) -> bool:\n')
          end = s.index('    def handle_order_update(self, update: Dict[str, Any]):\n', start)
          cancel = '''    def cancel_order(self, symbol: str, client_order_id: str) -> bool:
        """Request cancel; terminal local state requires an authoritative cumulative fill total."""
        intent = self.persistence.get_intent(client_order_id)
        if not intent:
            return False
        if intent["status"] in ("FILLED", "CANCELED", "REJECTED"):
            return False

        self.risk_engine.request_cancel(client_order_id)
        try:
            response = self.adapter.cancel_order(symbol, client_order_id)
        except Exception:
            self.risk_engine.restore_connection()
            raise

        raw_status = response.get("status", "UNKNOWN")
        if "orderId" not in response:
            self.risk_engine.restore_connection()
            self.persistence.update_intent_status(client_order_id, OrderState.UNKNOWN, raw_status=raw_status)
            return False

        exchange_order_id = str(response["orderId"])
        mapped_state = self.adapter._map_order_state(raw_status)
        if mapped_state != OrderState.CANCELED:
            # Cancel/fill races and ambiguous replies are reconciled rather than guessed.
            self.persistence.update_intent_status(
                client_order_id, OrderState.UNKNOWN, exchange_order_id, raw_status=raw_status)
            self.risk_engine.restore_connection()
            return False

        final_filled = self._authoritative_filled_qty(response.get("executedQty"))
        if final_filled is None:
            self.persistence.update_intent_status(
                client_order_id, OrderState.UNKNOWN, exchange_order_id, raw_status=raw_status)
            self.risk_engine.restore_connection()
            return True

        if not self.risk_engine.on_cancel_confirmed(client_order_id, final_filled):
            self.persistence.update_intent_status(
                client_order_id, OrderState.UNKNOWN, exchange_order_id, raw_status=raw_status)
            return True

        if not self._sync_authoritative_fill_total(
                client_order_id, final_filled, response.get("avgPrice")):
            self.persistence.update_intent_status(
                client_order_id, OrderState.UNKNOWN, exchange_order_id, raw_status=raw_status)
            return True

        self.persistence.update_intent_status(
            client_order_id, OrderState.CANCELED, exchange_order_id, raw_status=raw_status)
        return True

'''
