name: APGE Public Market Validation

on:
  push:
    branches:
      - apge-prelive-completion-v1
    paths:
      - 'src/apge/binance_public_data.py'
      - 'src/apge/backtest.py'
      - 'src/apge/market_regime.py'
      - 'src/apge/adaptive_policy.py'
      - 'src/apge/grid_strategy.py'
      - 'scripts/apge_public_market_validation.py'
      - '.github/workflows/apge-public-market-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-market-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade pip requests

      - name: Run read-only public market validation
        env:
          PYTHONPATH: src
        run: python scripts/apge_public_market_validation.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apge-public-market-validation
          path: apge_public_market_validation.json
          if-no-files-found: error
