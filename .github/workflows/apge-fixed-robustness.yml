name: APGE Fixed Historical Robustness

on:
  push:
    branches:
      - apge-repository-completion-v1
      - release/apge-v1-rc1
    paths:
      - 'src/apge/**'
      - 'scripts/apge_fixed_historical_robustness.py'
      - '.github/workflows/apge-fixed-robustness.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Fixed-window robustness research
        run: python scripts/apge_fixed_historical_robustness.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: apge-fixed-historical-robustness
          path: apge_fixed_historical_robustness.json
          if-no-files-found: error
