name: APGE Offline Gate

on:
  push:
    branches:
      - apge-03-controlled-grid-validation
      - apge-prelive-completion-v1
      - apge-repository-completion-v1
      - release/apge-v1-rc1
  pull_request:
    branches:
      - main
      - apge-03-controlled-grid-validation

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clean install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Verify installed package
        run: |
          python -m compileall -q src
          python -c "import apge; import apge.backtest; import apge.execution_engine; import apge.recovery"
          apge-bot --help >/dev/null

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run offline suite
        run: python -m pytest -q

      - name: Run deterministic runner smoke
        env:
          APGE_DB_PATH: runner-smoke.sqlite3
          APGE_MAX_CYCLES: '1'
        run: apge-bot --dry-run
