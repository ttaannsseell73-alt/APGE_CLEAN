name: APGE-03 Hardening Runner

on:
  push:
    branches:
      - apge-03-controlled-grid-validation

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[apge03-v4]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply APGE-03 V4 hardening
        run: |
          python .github/scripts/apge03_v4.py
          python .github/scripts/apge03_v4_fix.py
          python .github/scripts/apge03_v4_fix2.py

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Full offline gate
        env:
          PYTHONPATH: src
        run: |
          python -m pytest --collect-only -q
          python -m pytest -q

      - name: Commit validated source and tests
        shell: bash
        run: |
          git config user.name "APGE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix(apge): close reconciliation and submit consistency gaps"
          git push origin HEAD:apge-03-controlled-grid-validation
