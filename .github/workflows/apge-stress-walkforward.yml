name: APGE Stress Walk-forward

on:
  push:
    branches:
      - apge-prelive-completion-v1
    paths:
      - 'scripts/apge_stress_walkforward.py'
      - 'src/apge/backtest.py'
      - 'src/apge/binance_public_data.py'
      - 'src/apge/market_regime.py'
      - 'src/apge/adaptive_policy.py'
      - 'src/apge/grid_strategy.py'
      - '.github/workflows/apge-stress-walkforward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade pip requests

      - name: Run structural stress validation
        env:
          PYTHONPATH: src
        run: python scripts/apge_stress_walkforward.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apge-stress-walkforward
          path: apge_stress_walkforward.json
          if-no-files-found: error
